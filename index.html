<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>天机玄数</title>
</head>
<body>
    <!-- 你的输入框和测算页面 -->
    <input type="text" id="birthYear" placeholder="输入生辰年份">
    <input type="text" id="idNumber" placeholder="输入识别后4位">
    
    <!-- 你的 RM 1.68 支付按钮 -->
    <button onclick="startSuanmingPayment()">开启演练测算 (RM 1.68 一路发)</button>

    <!-- 把刚才的代码放在这里 -->
    <script>
        async function startSuanmingPayment() {
            const year = document.getElementById('birthYear')?.value;
            const number = document.getElementById('idNumber')?.value;

            if (!year || !number) {
                alert("请先填写生辰年份和个人专属识别后4位！");
                return;
            }

            if ('getDigitalGoodsService' in window) {
                try {
                    const service = await window.getDigitalGoodsService('https://play.google.com/billing');
                    
                    const paymentMethodData = [{
                        supportedMethods: 'https://play.google.com/billing',
                        data: { sku: 'tianji_168' } // 对应 Google Play 后台创建的 Product ID
                    }];
                    
                    const paymentDetails = {
                        total: {
                            label: '天机玄数演练测算',
                            amount: { currency: 'MYR', value: '1.68' }
                        }
                    };

                    const request = new PaymentRequest(paymentMethodData, paymentDetails);
                    const response = await request.show();

                    await response.complete('success');
                    
                    // 支付成功后，调用计算并显示最后 4 个数字的函数
                    showResultNumbers(year, number);

                } catch (err) {
                    console.error("支付取消或失败：", err);
                    alert("支付未完成，无法查看测算结果。");
                }
            } else {
                alert("请在 Google Play 下载的‘天机玄数’App 内完成支付体验。");
            }
        }

        // 算出最后 4 个数字并展示的函数
        function showResultNumbers(year, number) {
            // 在这里写你原本计算 4 个数字的算法逻辑
            alert("付款成功！您的专属幸运 4 个数字已生成！");
            // 例如：document.getElementById('result').innerText = "您的数字是：...";
        }
    </script>
</body>
</html>
