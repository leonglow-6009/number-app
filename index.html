<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天机玄数 - 个人生辰数理分析系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        .font-calligraphy { font-family: 'Ma Shan Zheng', cursive; }
        .font-serif-sc { font-family: 'Noto Serif SC', serif; }
        
        /* 4K 超高清玄幻背景图与遮罩 */
        .divine-bg {
            background-color: #050811;
            background-image: 
                radial-gradient(circle at center, rgba(212, 175, 55, 0.15) 0%, rgba(5, 8, 17, 0.85) 75%),
                linear-gradient(to bottom, rgba(5, 8, 17, 0.6), rgba(5, 8, 17, 0.9)),
                url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* 旋转八卦背景图阵 */
        .bagua-rotate {
            animation: rotateBagua 45s linear infinite;
        }
        @keyframes rotateBagua {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 金边与光效 */
        .gold-border {
            border: 1.5px solid rgba(234, 179, 8, 0.45);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.25), inset 0 0 20px rgba(212, 175, 55, 0.08);
        }
        .gold-text-glow {
            text-shadow: 0 0 12px rgba(250, 204, 21, 0.7), 0 0 24px rgba(212, 175, 55, 0.4);
        }
        .lucky-num-glow {
            text-shadow: 0 0 15px rgba(250, 204, 21, 0.9), 0 0 30px rgba(234, 179, 8, 0.6);
        }
    </style>
</head>
<body class="divine-bg font-serif-sc min-h-screen text-amber-100 flex flex-col justify-between items-center p-4 relative overflow-x-hidden">

    <!-- 动态八卦星盘特效背景 -->
    <div class="fixed inset-0 pointer-events-none flex items-center justify-center opacity-20 z-0">
        <svg class="bagua-rotate w-[600px] h-[600px]" viewBox="0 0 100 100" fill="currentColor">
            <circle cx="50" cy="50" r="48" stroke="#facc15" stroke-width="0.6" fill="none"/>
            <circle cx="50" cy="50" r="40" stroke="#facc15" stroke-width="0.4" fill="none" stroke-dasharray="1 2"/>
            <circle cx="50" cy="50" r="30" stroke="#facc15" stroke-width="0.3" fill="none"/>
            <path d="M50 2 A48 48 0 0 1 50 98 A24 24 0 0 1 50 50 A24 24 0 0 0 50 2 Z" fill="#facc15"/>
            <circle cx="50" cy="26" r="4" fill="#050811"/>
            <circle cx="50" cy="74" r="4" fill="#facc15"/>
        </svg>
    </div>

    <!-- 主体内容卡片 -->
    <main class="w-full max-w-md my-auto z-10">
        
        <!-- 头部标题 -->
        <header class="text-center mb-5">
            <div class="inline-block px-3 py-1 rounded-full bg-amber-950/80 border border-amber-500/40 text-amber-300 text-xs tracking-widest mb-2 shadow-md">
                ☯ 易经数理 · 密典算法
            </div>
            <h1 class="font-calligraphy text-4xl md:text-5xl text-amber-400 gold-text-glow tracking-wider">
                天机玄数
            </h1>
            <p class="text-xs text-amber-200/80 mt-2 font-medium tracking-widest">
                — 测算个人生辰与专属能量数字 —
            </p>
            <p class="text-sm font-bold text-yellow-300 mt-2 tracking-wider gold-text-glow">
                ✨ 祝您找到专属的最幸运4个号码 ✨
            </p>
        </header>

        <!-- 主面板 -->
        <div class="bg-slate-950/85 backdrop-blur-lg rounded-2xl p-6 gold-border relative">
            
            <!-- 装饰印章 -->
            <div class="absolute top-3 right-3 border border-red-700 bg-red-950/60 text-red-400 font-calligraphy text-xs px-2 py-0.5 rounded shadow">
                御算
            </div>

            <!-- 第一阶段：输入资料 -->
            <section id="input-section" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-amber-300 mb-2 tracking-wider">
                        【生辰年份】(例如: 1978)
                    </label>
                    <input type="number" id="birth-year" value="1978" placeholder="请输入出生年份" 
                        class="w-full bg-slate-900/90 border border-amber-500/40 rounded-lg px-4 py-3 text-amber-200 text-center font-bold tracking-widest focus:outline-none focus:border-amber-400 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-amber-300 mb-2 tracking-wider">
                        【个人专属识别后 4 位】(例如: 6009)
                    </label>
                    <input type="text" id="ic-last4" maxlength="4" value="6009" placeholder="请输入后4位数字" 
                        class="w-full bg-slate-900/90 border border-amber-500/40 rounded-lg px-4 py-3 text-amber-200 text-center font-bold tracking-widest focus:outline-none focus:border-amber-400 transition">
                </div>

                <div class="pt-2">
                    <button onclick="proceedToPayment()" 
                        class="w-full bg-gradient-to-r from-amber-600 via-yellow-500 to-amber-600 text-slate-950 font-black text-base py-3.5 rounded-lg shadow-xl hover:brightness-110 active:scale-[0.99] transition cursor-pointer tracking-widest">
                        开启演练测算（RM 1.68 一路发）
                    </button>
                    <p class="text-center text-xs font-semibold text-yellow-400/80 mt-2.5">
                        🧧 1.68 一路发 · 开启专属幸运磁场 🧧
                    </p>
                </div>
            </section>

            <!-- 第二阶段：选择支付方式 -->
            <section id="payment-section" class="hidden space-y-5 text-center">
                <div class="bg-amber-950/40 p-4 rounded-xl border border-amber-500/30">
                    <span class="text-xs text-amber-300/80">测算工本费</span>
                    <div class="text-3xl font-black text-amber-400 gold-text-glow my-1">RM 1.68</div>
                    <p class="text-xs font-semibold text-yellow-300">1.68 一路发 · 祝您好运连连</p>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button onclick="startCalculation()" class="p-3 bg-slate-900/90 border border-amber-500/40 rounded-xl hover:border-amber-400 transition text-left cursor-pointer">
                        <div class="text-amber-400 font-bold text-sm">DuitNow QR</div>
                        <div class="text-[10px] text-amber-200/60">即时二维码过账</div>
                    </button>
                    <button onclick="startCalculation()" class="p-3 bg-slate-900/90 border border-amber-500/40 rounded-xl hover:border-amber-400 transition text-left cursor-pointer">
                        <div class="text-blue-400 font-bold text-sm">Touch 'n Go</div>
                        <div class="text-[10px] text-amber-200/60">TnG 电子钱包</div>
                    </button>
                </div>

                <button onclick="cancelPayment()" class="text-xs text-amber-400/70 hover:text-amber-300 transition underline pt-2">
                    返回修改资料
                </button>
            </section>

            <!-- 第三阶段：天机演练动画 -->
            <section id="anim-section" class="hidden py-8 text-center space-y-4">
                <div class="relative w-20 h-20 mx-auto">
                    <div class="absolute inset-0 border-4 border-amber-500/20 border-t-amber-400 rounded-full animate-spin"></div>
                    <div class="absolute inset-2 border-4 border-yellow-600/20 border-b-yellow-500 rounded-full animate-spin" style="animation-direction: reverse; animation-duration: 1.5s;"></div>
                    <div class="h-full flex items-center justify-center font-calligraphy text-2xl text-amber-400">卦</div>
                </div>
                <div id="anim-text" class="text-sm font-semibold text-amber-300 tracking-wider">
                    正在推演专属 4 位幸运数字...
                </div>
            </section>

            <!-- 第四阶段：天机玄数结果揭晓 -->
            <section id="result-section" class="hidden space-y-5 text-center">
                <div class="bg-amber-950/30 p-5 rounded-xl border border-amber-500/40 relative">
                    <span class="text-xs text-amber-300/80 tracking-widest font-semibold">✨ 您专属的最幸运 4 个号码 ✨</span>
                    
                    <div id="lucky-number-display" class="text-5xl font-black text-amber-300 lucky-num-glow tracking-[0.2em] my-4 font-mono">
                        ----
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2 text-xs border-t border-b border-amber-500/30 py-3 my-3 text-amber-200/90">
                        <div>主导五行：<span id="wuxing-text" class="text-amber-400 font-bold">--</span></div>
                        <div>契合方位：<span id="direction-text" class="text-amber-400 font-bold">--</span></div>
                    </div>

                    <p id="analysis-text" class="text-xs text-amber-100/80 leading-relaxed text-justify px-2"></p>
                </div>

                <div class="flex gap-2">
                    <button onclick="copyNumber()" class="flex-1
