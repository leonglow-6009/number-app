<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天机玄数 - 个人生辰数理分析系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        .font-calligraphy { font-family: 'Ma Shan Zheng', cursive; }
        .font-serif-sc { font-family: 'Noto Serif SC', serif; }
        
        /* 古风玄幻背景图与叠加效果 */
        .divine-bg {
            background-color: #060913;
            background-image: 
                linear-gradient(to bottom, rgba(6, 9, 19, 0.75), rgba(6, 9, 19, 0.92)),
                url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* 旋转八卦背景图阵 */
        .bagua-rotate {
            animation: rotateBagua 60s linear infinite;
        }
        @keyframes rotateBagua {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 发光与金边质感 */
        .gold-border {
            border: 1.5px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15), inset 0 0 15px rgba(212, 175, 55, 0.05);
        }
        .gold-text-glow {
            text-shadow: 0 0 10px rgba(234, 179, 8, 0.5), 0 0 20px rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body class="divine-bg font-serif-sc min-h-screen text-amber-100 flex flex-col justify-between items-center p-4 relative overflow-x-hidden">

    <!-- 旋转八卦水纹阵背景 -->
    <div class="fixed inset-0 pointer-events-none flex items-center justify-center opacity-10 z-0">
        <svg class="bagua-rotate w-[500px] h-[500px]" viewBox="0 0 100 100" fill="currentColor">
            <circle cx="50" cy="50" r="48" stroke="#d4af37" stroke-width="0.5" fill="none"/>
            <circle cx="50" cy="50" r="40" stroke="#d4af37" stroke-width="0.5" fill="none" stroke-dasharray="1 2"/>
            <path d="M50 2 A48 48 0 0 1 50 98 A24 24 0 0 1 50 50 A24 24 0 0 0 50 2 Z" fill="#d4af37"/>
            <circle cx="50" cy="26" r="4" fill="#060913"/>
            <circle cx="50" cy="74" r="4" fill="#d4af37"/>
        </svg>
    </div>

    <!-- 主体容器 -->
    <main class="w-full max-w-md my-auto z-10">
        
        <!-- 头部标题 -->
        <header class="text-center mb-6">
            <div class="inline-block px-3 py-1 rounded-full bg-amber-950/60 border border-amber-500/30 text-amber-400 text-xs tracking-widest mb-2">
                ☯ 易经数理 · 密典算法
            </div>
            <h1 class="font-calligraphy text-4xl md:text-5xl text-amber-400 gold-text-glow tracking-wider">
                天机玄数
            </h1>
            <p class="text-xs text-amber-200/60 mt-2 tracking-widest">
                — 测算个人生辰与专属能量数字 —
            </p>
        </header>

        <!-- 卡片主体 -->
        <div class="bg-slate-950/80 backdrop-blur-md rounded-2xl p-6 gold-border relative">
            
            <!-- 装饰角印 -->
            <div class="absolute top-2 right-2 border border-red-800/60 bg-red-950/40 text-red-500 font-calligraphy text-xs px-2 py-0.5 rounded opacity-75">
                御算
            </div>

            <!-- 第一阶段：输入资料 -->
            <section id="input-section" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-amber-300 mb-2 tracking-wider">
                        【生辰年份】(例如: 1978)
                    </label>
                    <input type="number" id="birth-year" value="1978" placeholder="请输入出生年份" 
                        class="w-full bg-slate-900/90 border border-amber-500/30 rounded-lg px-4 py-3 text-amber-200 text-center font-bold tracking-widest focus:outline-none focus:border-amber-400 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-amber-300 mb-2 tracking-wider">
                        【个人专属识别后 4 位】(例如: 6009)
                    </label>
                    <input type="text" id="ic-last4" maxlength="4" value="6009" placeholder="请输入后4位数字" 
                        class="w-full bg-slate-900/90 border border-amber-500/30 rounded-lg px-4 py-3 text-amber-200 text-center font-bold tracking-widest focus:outline-none focus:border-amber-400 transition">
                </div>

                <div class="pt-2">
                    <button onclick="proceedToPayment()" 
                        class="w-full bg-gradient-to-r from-amber-700 via-yellow-600 to-amber-700 text-slate-950 font-bold text-base py-3.5 rounded-lg shadow-lg hover:brightness-110 active:scale-[0.99] transition cursor-pointer tracking-widest">
                        开启演练测算（RM 1.68）
                    </button>
                    <p class="text-center text-[10px] text-amber-400/50 mt-2">
                        * 每次易字推演仅收成本工本费 RM 1.68
                    </p>
                </div>
            </section>

            <!-- 第二阶段：选择支付 -->
            <section id="payment-section" class="hidden space-y-5 text-center">
                <div class="bg-amber-950/30 p-4 rounded-xl border border-amber-500/20">
                    <span class="text-xs text-amber-300/70">解密工本费</span>
                    <div class="text-3xl font-black text-amber-400 gold-text-glow my-1">RM 1.68</div>
                    <p class="text-[11px] text-amber-200/50">请选择过账渠道以开启天机阵演练</p>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button onclick="startCalculation()" class="p-3 bg-slate-900/90 border border-amber-500/30 rounded-xl hover:border-amber-400 transition text-left cursor-pointer">
                        <div class="text-amber-400 font-bold text-sm">DuitNow QR</div>
                        <div class="text-[10px] text-amber-200/50">即时二维码扣税</div>
                    </button>
                    <button onclick="startCalculation()" class="p-3 bg-slate-900/90 border border-amber-500/30 rounded-xl hover:border-amber-400 transition text-left cursor-pointer">
                        <div class="text-blue-400 font-bold text-sm">Touch 'n Go</div>
                        <div class="text-[10px] text-amber-200/50">TnG 电子钱包</div>
                    </button>
                </div>

                <button onclick="cancelPayment()" class="text-xs text-amber-400/60 hover:text-amber-300 transition underline pt-2">
                    返回修改生辰资料
                </button>
            </section>

            <!-- 第三阶段：天机演练动画 -->
            <section id="anim-section" class="hidden py-8 text-center space-y-4">
                <div class="relative w-20 h-20 mx-auto">
                    <div class="absolute inset-0 border-4 border-amber-500/20 border-t-amber-400 rounded-full animate-spin"></div>
                    <div class="absolute inset-2 border-4 border-yellow-600/20 border-b-yellow-500 rounded-full animate-spin" style="animation-direction: reverse; animation-duration: 1.5s;"></div>
                    <div class="h-full flex items-center justify-center font-calligraphy text-2xl text-amber-400">卦</div>
                </div>
                <div id="anim-text" class="text-sm font-semibold text-amber-300 tracking-wider">
                    正在调和阴阳五行...
                </div>
            </section>

            <!-- 第四阶段：天机玄数结果揭晓 -->
            <section id="result-section" class="hidden space-y-5 text-center">
                <div class="bg-amber-950/20 p-5 rounded-xl border border-amber-500/30 relative">
                    <span class="text-xs text-amber-400/70 tracking-widest uppercase">您的专属天机能量数字</span>
                    
                    <div id="lucky-number-display" class="text-5xl font-black text-amber-300 gold-text-glow tracking-[0.2em] my-4 font-mono">
                        ----
                    </div>
                    
                    <!-- 五行与方位简析 -->
                    <div class="grid grid-cols-2 gap-2 text-xs border-t border-b border-amber-500/20 py-3 my-3 text-amber-200/80">
                        <div>主导五行：<span id="wuxing-text" class="text-amber-400 font-bold">--</span></div>
                        <div>契合方位：<span id="direction-text" class="text-amber-400 font-bold">--</span></div>
                    </div>

                    <p id="analysis-text" class="text-xs text-amber-100/70 leading-relaxed text-justify px-2"></p>
                </div>

                <div class="flex gap-2">
                    <button onclick="copyNumber()" class="flex-1 bg-amber-950/60 border border-amber-500/40 text-amber-300 text-xs py-2.5 rounded-lg hover:bg-amber-900/50 transition">
                        📋 复制幸运号码
                    </button>
                    <button onclick="resetApp()" class="flex-1 bg-gradient-to-r from-amber-700 to-yellow-600 text-slate-950 text-xs font-bold py-2.5 rounded-lg hover:brightness-110 transition">
                        ☯ 重新测算
                    </button>
                </div>
            </section>

        </div>

        <!-- 底部说明（符合 Google Play 合规要求） -->
        <footer class="text-center text-[10px] text-amber-300/40 mt-6 leading-relaxed px-4">
            * 本程序基于传统易经数理算法进行能量概率推算，结果仅供日常生活偏好与运势娱乐参考，无任何赌博或预测承诺。
        </footer>
    </main>

    <script>
        function proceedToPayment() {
            const year = document.getElementById('birth-year').value;
            const ic = document.getElementById('ic-last4').value;
            if(!year || ic.length !== 4) {
                alert('请填写正确的出生年份与 4 位识别数字！');
                return;
            }
            document.getElementById('input-section').classList.add('hidden');
            document.getElementById('payment-section').classList.remove('hidden');
        }

        function cancelPayment() {
            document.getElementById('payment-section').classList.add('hidden');
            document.getElementById('input-section').classList.remove('hidden');
        }

        function startCalculation() {
            document.getElementById('payment-section').classList.add('hidden');
            document.getElementById('anim-section').classList.remove('hidden');

            const texts = ["正在调和阴阳五行...", "推算八卦天干地支...", "凝聚个人专属气场..."];
            let idx = 0;
            const interval = setInterval(() => {
                idx = (idx + 1) % texts.length;
                document.getElementById('anim-text').innerText = texts[idx];
            }, 800);

            setTimeout(() => {
                clearInterval(interval);
                showResults();
            }, 2600);
        }

        function showResults() {
            const year = parseInt(document.getElementById('birth-year').value);
            const ic = document.getElementById('ic-last4').value;
            
            const yearDigits = String(year).split('').map(Number);
            const icDigits = ic.split('').map(Number);
            
            const d1 = yearDigits.reduce((a,b)=>a+b, 0) % 10;
            const d2 = (icDigits[0] + icDigits[1]) % 10;
            const d3 = (icDigits[2] + icDigits[3]) % 10;
            const d4 = (yearDigits.reduce((a,b)=>a+b, 0) + icDigits.reduce((a,b)=>a+b, 0)) % 10;
            
            const luckyNum = `${d1}${d2}${d3}${d4}`;
            
            // 五行与方位映射
            const wuxingList = ["五行属木 · 生机勃勃", "五行属火 · 旺盛辉煌", "五行属土 · 稳如泰山", "五行属金 · 坚刚利禄", "五行属水 · 智水流长"];
            const directionList = ["正东方 (生旺)", "正南方 (财富)", "西南方 (吉庆)", "正西方 (贵人)", "正北方 (玄武)"];
            
            const selectedWuxing = wuxingList[d1 % wuxingList.length];
            const selectedDir = directionList[d4 % directionList.length];

            document.getElementById('lucky-number-display').innerText = luckyNum;
            document.getElementById('wuxing-text').innerText = selectedWuxing.split(' · ')[0];
            document.getElementById('direction-text').innerText = selectedDir.split(' ')[0];
            
            document.getElementById('analysis-text').innerText = 
                `经易术演练，此组数字【${luckyNum}】融合了您的生辰干支磁场。${selectedWuxing}，建议在日常抉择、选号或决策时予以优先参考。`;

            document.getElementById('anim-section').classList.add('hidden');
            document.getElementById('result-section').classList.remove('hidden');
        }

        function copyNumber() {
            const num = document.getElementById('lucky-number-display').innerText;
            navigator.clipboard.writeText(num).then(() => {
                alert('专属幸运号码已成功复制到剪贴板！');
            });
        }

        function resetApp() {
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('input-section').classList.remove('hidden');
        }
    </script>
</body>
</html>
