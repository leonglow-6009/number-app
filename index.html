<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天机玄数</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:active {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>天机玄数测算</h2>
        <input type="text" id="birthYear" placeholder="输入生辰年份 (例如 1980)">
        <input type="text" id="idNumber" placeholder="输入识别后4位">
        
        <button onclick="startSuanmingPayment()">开启演练测算 (RM 1.68)</button>
        <div id="result" style="margin-top: 20px; font-weight: bold; color: #d97706;"></div>
    </div>

    <script>
        async function startSuanmingPayment() {
            const year = document.getElementById('birthYear')?.value;
            const number = document.getElementById('idNumber')?.value;

            if (!year || !number) {
                alert("请先填写生辰年份和识别后4位！");
                return;
            }

            if ('getDigitalGoodsService' in window) {
                try {
                    const service = await window.getDigitalGoodsService('https://play.google.com/billing');
                    
                    const paymentMethodData = [{
                        supportedMethods: 'https://play.google.com/billing',
                        data: { sku: 'tianji_168' }
                    }];
                    
                    const paymentDetails = {
                        total: {
                            label: '天机玄数演练测算',
                            amount: { currency: 'MYR', value: '1.68' }
                        }
                    };

                    const request = new PaymentRequest(paymentMethodData, paymentDetails);
                    const response = await request.show();

                    await response.complete('success');
                    
                    // 支付成功后显示结果
                    document.getElementById('result').innerText = "付款成功！您的专属 4 个数字已生成：8, 3, 9, 2";

                } catch (err) {
                    console.error("支付取消：", err);
                    alert("支付未完成。");
                }
            } else {
                alert("请在 Google Play 下载的 App 内完成支付。");
            }
        }
    </script>
</body>
</html>
